block:
  target:
    entity:
      integration: asic_fleet

unblock:
  target:
    entity:
      integration: asic_fleet

reboot:
  target:
    entity:
      integration: asic_fleet

blink:
  target:
    entity:
      integration: asic_fleet
  fields:
    "on":
      default: true
      selector:
        boolean:

block_rack:
  fields:
    rack:
      required: true
      example: R1
      selector:
        text:

unblock_rack:
  fields:
    rack:
      required: true
      example: R1
      selector:
        text:

reboot_rack:
  fields:
    rack:
      required: true
      example: R1
      selector:
        text:
    stagger:
      default: 5
      selector:
        number:
          min: 0
          max: 600
          unit_of_measurement: s
          mode: box

assign_name:
  fields:
    mac:
      required: true
      example: "B4:2E:99:AA:BB:CC"
      selector:
        text:
    name:
      required: true
      example: R1-ASIC57
      selector:
        text:
    rack:
      example: R1
      selector:
        text:

set_pools:
  target:
    entity:
      integration: asic_fleet
  fields:
    pools:
      required: true
      selector:
        object:

refresh:

discover:

add_device:
  fields:
    mac:
      required: true
      example: "B4:2E:99:AA:BB:CC"
      selector:
        text:
    ip:
      example: "10.100.39.42"
      selector:
        text:
    name:
      example: R1-ASIC57
      selector:
        text:
    rack:
      example: R1
      selector:
        text:

forget_device:
  target:
    entity:
      integration: asic_fleet
  fields:
    mac:
      example: "B4:2E:99:AA:BB:CC"
      selector:
        text:

reset:
  fields:
    keep_manual:
      default: true
      selector:
        boolean:
